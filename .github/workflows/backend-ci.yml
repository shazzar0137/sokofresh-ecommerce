# Backend continuous integration (Phase 3).
# Runs on every push and pull request that touches the backend, the shared
# contract or this workflow. Nothing here deploys anywhere.
name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - "shared/contracts/**"
      - "shared/test-fixtures/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "shared/contracts/**"
      - "shared/test-fixtures/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: backend
          enable-cache: true
      - name: Install dependencies (exactly as locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check --output-format=github .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests (pytest + PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sokofresh
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sokofresh_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sokofresh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sokofresh:ci-only-password@localhost:5432/sokofresh_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: backend
          enable-cache: true
      - name: Install dependencies (exactly as locked)
        run: uv sync --locked
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      # Includes the OpenAPI drift check (tests/contract) and the production
      # `check --deploy` run (tests/integration/test_settings.py).
      - name: Run tests (with coverage)
        run: uv run coverage run -m pytest
      # Minimum coverage of application code; settings in pyproject.toml
      # [tool.coverage] (Phase 3 integration review).
      - name: Coverage report and minimum
        run: uv run coverage report

  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: backend
          enable-cache: true
      - name: Install dependencies (exactly as locked)
        run: uv sync --locked
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          uv export --format requirements-txt --all-groups --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --progress-spinner off
