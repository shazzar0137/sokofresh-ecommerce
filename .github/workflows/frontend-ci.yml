# Frontend continuous integration (Phase 3).
# Runs on every pull request, and on pushes that touch the frontend, the shared
# contract or fixtures, or this workflow. Nothing here deploys anywhere.
name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "shared/contracts/**"
      - "shared/test-fixtures/**"
      - ".github/workflows/frontend-ci.yml"
  # No path filter on pull requests: a workflow skipped by a path filter never
  # reports, so its checks could not be "required" on main (review QA-2).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  # Never cancel a run on main, so every main commit keeps a CI result (QA-8).
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: frontend

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Rewrites are baked into the build; CI never talks to a real backend.
  BACKEND_ORIGIN: http://127.0.0.1:8000
  # Required for production builds; a local address is allowed for CI builds (no HSTS).
  NEXT_PUBLIC_SITE_URL: http://localhost:3999

jobs:
  checks:
    name: Lint, types, contract, unit/component tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (supply-chain safety); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (exactly as locked, no install scripts)
        run: npm ci --ignore-scripts
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: API types match shared/contracts/openapi.yaml (drift check)
        run: npm run api:check
      - name: Unit, component, integration and accessibility tests (Vitest + axe)
        run: npm run test:coverage
      - name: Production build (without test-only flags)
        run: npm run build
      # The real production configuration: no design-system page, no MSW worker
      # or code, no mock-data banner, and initial JS within budget (QA-1, PERF-1).
      - name: Check the production build
        run: npm run check:production

  dependency-audit:
    name: Dependency audit (npm audit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
      # Fails on high or critical advisories in any dependency (runtime or tooling).
      - name: Audit the lockfile for known vulnerabilities
        run: npm audit --audit-level=high

  e2e:
    name: End-to-end and accessibility (Playwright + axe)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (exactly as locked, no install scripts)
        run: npm ci --ignore-scripts
      - name: Install the Chromium browser for Playwright
        run: npx playwright install --with-deps chromium
      # Builds and starts the production server itself (playwright.config.ts webServer).
      - name: Run Playwright tests
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
